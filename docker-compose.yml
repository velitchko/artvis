services:

  artvis-backend:
    container_name: artvis-backend
    networks:
      - artvis-net
    external_links:
      - artvis-db
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
    ports:
      - 4000:4000
    restart: 'no'
    volumes:
      - ./backend:/backend
      - ./backend/node_modules:/backend/node_modules
    build:
      context: ./backend
      dockerfile: Dockerfile

  artvis-frontend:
    container_name: artvis-frontend
    networks:
      - artvis-net
    external_links:
      - artvis-db
    depends_on: 
      - artvis-backend
    ports:
      - 4200:4200
    restart: 'on-failure'
    volumes:
      - ./frontend:/frontend
      - ./frontend/node_modules:/frontend/node_modules
    build:
      context: ./frontend
      dockerfile: Dockerfile

networks:
  artvis-net:
    name: artvis-network
    external: true
