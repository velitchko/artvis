version: '3.8'

services:

  artvis-backend:
    image: artvis-backend/node:18
    container_name: artvis-backend
    networks:
      - artvis-net
    external_links: 
      - artvis-db
    environment:
      -  NODE_OPTIONS=--max-old-space-size=8192
    ports:
      - 4000:4000
    restart: 'no'
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    build: 
      context: ./backend
      
  artvis-frontend:
    image: artvis-frontend/node:18
    container_name: artvis-frontend
    networks:
      - artvis-net
    external_links: 
      - artvis-db
    ports:
      - 4200:4200
    restart: 'no'
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    build: 
      context: ./frontend

networks:
    artvis-net:
        external: 
            name: artvis-network